name: Deploy to Cloudflare Workers

# 推送到 main 分支时自动部署到 Cloudflare Workers Static Assets。
# 替代了原 Cloudflare Pages 的 Git 自动构建。
#
# 前置条件（在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置）：
#   - CLOUDFLARE_API_TOKEN   Cloudflare API Token，需要 "Edit Cloudflare Workers" 权限
#       创建入口：https://dash.cloudflare.com/profile/api-tokens
#       模板：Edit Cloudflare Workers（官方预置模板）
#   - CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
#       在 dashboard 右上角账户下拉或任一 Worker 概览页可复制

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

# 同一分支新推送到来时取消进行中的部署，避免并发
concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run check
          npm test

      - name: Configure payment secret when supplied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WAFFO_PRIVATE_KEY: ${{ secrets.WAFFO_PRIVATE_KEY }}
        run: |
          if [ -n "$WAFFO_PRIVATE_KEY" ]; then
            printf '%s' "$WAFFO_PRIVATE_KEY" | npx wrangler secret put WAFFO_PRIVATE_KEY
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # Build copies only public files into dist/public; private key is a Worker secret.
